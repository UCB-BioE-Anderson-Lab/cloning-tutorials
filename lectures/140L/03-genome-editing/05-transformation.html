<article class="slide" data-bg="section">
  <h1>Transformation<br>and Plating</h1>
  <template class="notes">The rest of this is the bench work for the week, and it picks up where the fabrication lecture left off. You have DNA; now you have to get it into cells.</template>
  <template class="desc">Section divider: Transformation and Plating.</template>
</article>

<article class="slide">
  <h1 class="small">Petri dish</h1>
  <figure class="fig">
    <img src="img/05-petri-dish.png" alt="A petri dish after plating, covered in a dense lawn of small colonies.">
  </figure>
  <template class="notes">This is what too many cells looks like. You want countable colonies, not a lawn, which is mostly a question of how much you plate.</template>
  <template class="desc">A photograph of a petri dish carrying a dense lawn of colonies.</template>
</article>

<article class="slide">
  <h1 class="small">KCM heat-shock transformation</h1>
  <figure class="fig">
    <img src="img/05-kcm-protocol.png" alt="The KCM heat-shock transformation protocol written out in thirteen numbered steps: thaw the competent cells, add KCM, hold on ice, heat shock at 42 degrees, recover in 2YT, and plate on selective medium.">
    <figcaption>The protocol as it is written at the bench &mdash; thirteen steps from thawed cells to a plated transformation</figcaption>
  </figure>
  <p class="see">The same protocol, step by step:
     <a href="../../../wetlab/transformation/">Transformation tutorial</a> &nbsp;&middot;&nbsp;
     <a href="../../../cheatsheets/transformation.pdf">bench cheatsheet</a></p>
  <template class="notes">This protocol describes the KCM heat shock protocol for E. coli transformation from a ligation reaction or pure DNA. If you are transforming pure DNA, you will likely want to dilute the material 10 to 20 times in water and use 1 microlitre of the dilution for transformation.</template>
  <template class="desc">The KCM heat-shock transformation protocol in full, thirteen numbered steps, with links to the same protocol in the tutorials and on the bench cheatsheet.</template>
</article>

<article class="slide">
  <h1 class="small">Then leave it overnight</h1>
  <figure class="fig">
    <img src="img/05-overnight.png" alt="A crescent moon in a night sky: the plates go in the 37 degree incubator and nothing happens until tomorrow.">
  </figure>
  <template class="notes">Plate, invert, 37 degrees, and that is the day. Nothing you can do now changes what comes up.</template>
  <template class="desc">A picture of a crescent moon, standing for the overnight incubation.</template>
</article>
