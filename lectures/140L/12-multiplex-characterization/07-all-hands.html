<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<title>All-Hands &ndash; Multiplex Characterization</title>
<link rel="stylesheet" href="../../deck.css">
<style>
.slide figure.fig{flex:1 1 auto;min-height:0;display:flex;align-items:center;
  justify-content:center;margin:6px 0 0}
.slide figure.fig img{max-width:100%;max-height:100%;width:auto;height:auto;
  object-fit:contain}
.slide .big{flex:1 1 auto;display:flex;align-items:center;justify-content:center}
.slide .big p{font-size:84px;font-family:var(--sans);font-weight:700;margin:0;
  text-align:center;line-height:1.1}
.slide ul.tight li{font-size:28px;margin-bottom:12px}
.slide ul.fill{margin-top:auto;margin-bottom:auto}
.slide ul.fill li{font-size:28px;margin-bottom:18px}
.slide pre.seqblock{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:13px;line-height:1.35;white-space:pre-wrap;word-break:break-all;
  margin:10px 0 0;color:var(--ink)}
.slide p.sub{font-size:26px;color:var(--muted);margin:0 0 6px}
</style>
</head>
<body>

<!-- ---------------------------------------------------------------- 40 -->
<article class="slide" data-bg="section">
  <div class="big"><p>All-Hands</p></div>
  <template class="notes"></template>
  <template class="desc">All-Hands.</template>
</article>

<!-- ---------------------------------------------------------------- 41 -->
<article class="slide" data-bg="section">
  <div class="big"><p>Plib</p></div>
  <p class="sub">To get through Plib, you probably need to order oligos this week</p>
  <template class="notes"></template>
  <template class="desc">Plib.</template>
</article>

<!-- ---------------------------------------------------------------- 42 -->
<article class="slide">
  <h1>Independent Projects</h1>
  <figure class="fig"><img src="img/42-projects.png" alt="Figure from the slide Independent Projects."></figure>
  <template class="notes"></template>
  <template class="desc">Independent Projects.</template>
</article>

<!-- ---------------------------------------------------------------- 43 -->
<article class="slide">
  <h1>Questions?</h1>
  <template class="notes"></template>
  <template class="desc">Questions?.</template>
</article>

<script src="../../deck.js" defer></script>
<script src="lecture.js" defer></script>
</body>
</html>
