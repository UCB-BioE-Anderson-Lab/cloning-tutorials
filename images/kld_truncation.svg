<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 470" width="1300" height="470">
<rect width="1300" height="470" fill="#ffffff"/>
<text x="650.0" y="32.0" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#1f2429" text-anchor="middle" font-weight="bold">Truncating a gene by KLD: one PCR, no restriction site, any size of deletion</text>
<circle cx="160" cy="160" r="74" fill="none" stroke="#9aa3ab" stroke-width="8"/>
<path d="M 97.2 120.8 A 74 74 0 0 1 220.6 117.6" fill="none" stroke="#2f6fb3" stroke-width="13" stroke-linecap="butt"/>
<path d="M 220.6 117.6 A 74 74 0 0 1 220.6 202.4" fill="none" stroke="#d9534f" stroke-width="13" stroke-linecap="butt"/>
<path d="M 231.1 106.4 A 89 89 0 0 0 172.4 71.9" fill="none" stroke="#2e8b57" stroke-width="6.5"/>
<polygon points="156.9,71.1 171.2,80.3 173.6,63.4" fill="#2e8b57"/>
<path d="M 231.1 213.6 A 89 89 0 0 1 172.4 248.1" fill="none" stroke="#2e8b57" stroke-width="6.5"/>
<polygon points="156.9,248.9 171.2,239.7 173.6,256.6" fill="#2e8b57"/>
<text x="150.0" y="52.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#2e8b57" text-anchor="end" font-weight="bold">rev primer</text>
<text x="158.0" y="278.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#2e8b57" text-anchor="end" font-weight="bold">fwd primer</text>
<text x="74.0" y="114.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#2f6fb3" text-anchor="end" font-weight="bold">CDS</text>
<line x1="232.9" y1="172.8" x2="218" y2="246" stroke="#d9534f" stroke-width="1"/>
<text x="222.0" y="250.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#d9534f" text-anchor="start" font-weight="bold">region removed</text>
<text x="160.0" y="156.0" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5d666e" text-anchor="middle" font-weight="normal">parent</text>
<text x="160.0" y="171.0" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5d666e" text-anchor="middle" font-weight="normal">plasmid</text>
<circle cx="231.1" cy="106.4" r="4.5" fill="#1f2429"/>
<line x1="231.1" y1="106.4" x2="264" y2="82" stroke="#1f2429" stroke-width="1"/>
<text x="268.0" y="80.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2429" text-anchor="start" font-weight="bold">5′ tail: new</text>
<text x="268.0" y="95.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2429" text-anchor="start" font-weight="bold">stop codon</text>
<text x="160.0" y="300.0" font-family="Helvetica,Arial,sans-serif" font-size="14.5" fill="#1f2429" text-anchor="middle" font-weight="bold">1. Design</text>
<text x="160.0" y="322.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#5d666e" text-anchor="middle" font-weight="normal">Primers anneal just outside the</text>
<text x="160.0" y="338.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#5d666e" text-anchor="middle" font-weight="normal">region to be removed and point</text>
<text x="160.0" y="354.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#5d666e" text-anchor="middle" font-weight="normal">away from each other.</text>
<line x1="266" y1="160" x2="333" y2="160" stroke="#5d666e" stroke-width="2.5"/>
<polygon points="346,160 333,153.5 333,166.5" fill="#5d666e"/>
<text x="306.0" y="126.0" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2429" text-anchor="middle" font-weight="bold">PCR</text>
<text x="306.0" y="143.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5d666e" text-anchor="middle" font-weight="normal">high-fidelity polymerase</text>
<rect x="388" y="151.5" width="224" height="6.5" fill="#9aa3ab"/>
<rect x="388" y="151.5" width="74" height="6.5" fill="#2f6fb3"/>
<rect x="388" y="162.0" width="224" height="6.5" fill="#9aa3ab"/>
<rect x="388" y="162.0" width="74" height="6.5" fill="#2f6fb3"/>
<text x="378.0" y="157.5" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#d9534f" text-anchor="end" font-weight="bold">HO–</text>
<text x="622.0" y="169.0" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#d9534f" text-anchor="start" font-weight="bold">–OH</text>
<text x="378.0" y="172.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5d666e" text-anchor="end" font-weight="normal">5′</text>
<text x="622.0" y="154.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5d666e" text-anchor="start" font-weight="normal">5′</text>
<text x="500.0" y="208.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#5d666e" text-anchor="middle" font-weight="normal">linear · blunt · full length,</text>
<text x="500.0" y="224.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#5d666e" text-anchor="middle" font-weight="normal">minus the truncated region</text>
<text x="500.0" y="300.0" font-family="Helvetica,Arial,sans-serif" font-size="14.5" fill="#1f2429" text-anchor="middle" font-weight="bold">2. PCR product</text>
<text x="500.0" y="322.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#d9534f" text-anchor="middle" font-weight="normal">Ends come off the machine as 5′</text>
<text x="500.0" y="338.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#d9534f" text-anchor="middle" font-weight="normal">hydroxyls, so Ligate refuses them.</text>
<line x1="606" y1="160" x2="687" y2="160" stroke="#5d666e" stroke-width="2.5"/>
<polygon points="700,160 687,153.5 687,166.5" fill="#5d666e"/>
<text x="653.0" y="126.0" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2429" text-anchor="middle" font-weight="bold">Phosphorylate</text>
<text x="653.0" y="143.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5d666e" text-anchor="middle" font-weight="normal">T4 PNK</text>
<rect x="728" y="151.5" width="224" height="6.5" fill="#9aa3ab"/>
<rect x="728" y="151.5" width="74" height="6.5" fill="#2f6fb3"/>
<rect x="728" y="162.0" width="224" height="6.5" fill="#9aa3ab"/>
<rect x="728" y="162.0" width="74" height="6.5" fill="#2f6fb3"/>
<circle cx="726.0" cy="154.8" r="8" fill="#e0a030" stroke="#a9741a" stroke-width="1.1"/>
<text x="726.0" y="158.6" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#3a2a05" text-anchor="middle" font-weight="bold">P</text>
<circle cx="954.0" cy="165.2" r="8" fill="#e0a030" stroke="#a9741a" stroke-width="1.1"/>
<text x="954.0" y="169.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#3a2a05" text-anchor="middle" font-weight="bold">P</text>
<text x="718.0" y="172.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5d666e" text-anchor="end" font-weight="normal">5′</text>
<text x="962.0" y="154.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5d666e" text-anchor="start" font-weight="normal">5′</text>
<text x="840.0" y="208.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#5d666e" text-anchor="middle" font-weight="normal">a phosphate on each 5′ end</text>
<text x="840.0" y="300.0" font-family="Helvetica,Arial,sans-serif" font-size="14.5" fill="#1f2429" text-anchor="middle" font-weight="bold">3. Phosphorylate</text>
<text x="840.0" y="322.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#5d666e" text-anchor="middle" font-weight="normal">In the tube this is the K of KLD;</text>
<text x="840.0" y="338.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#5d666e" text-anchor="middle" font-weight="normal">in a construction file it is its</text>
<text x="840.0" y="354.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#5d666e" text-anchor="middle" font-weight="normal">own step.</text>
<line x1="952" y1="160" x2="1055" y2="160" stroke="#5d666e" stroke-width="2.5"/>
<polygon points="1068,160 1055,153.5 1055,166.5" fill="#5d666e"/>
<text x="1010.0" y="126.0" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2429" text-anchor="middle" font-weight="bold">Ligate</text>
<text x="1010.0" y="143.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5d666e" text-anchor="middle" font-weight="normal">T4 ligase, blunt</text>
<circle cx="1180" cy="160" r="60" fill="none" stroke="#9aa3ab" stroke-width="8"/>
<path d="M 1129.1 128.2 A 60 60 0 0 1 1229.1 125.6" fill="none" stroke="#2f6fb3" stroke-width="13" stroke-linecap="butt"/>
<text x="1180.0" y="156.0" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5d666e" text-anchor="middle" font-weight="normal">truncated</text>
<text x="1180.0" y="171.0" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#5d666e" text-anchor="middle" font-weight="normal">plasmid</text>
<circle cx="1229.1" cy="125.6" r="5" fill="#1f2429"/>
<line x1="1229.1" y1="125.6" x2="1162" y2="76" stroke="#1f2429" stroke-width="1"/>
<text x="1158.0" y="74.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2429" text-anchor="end" font-weight="bold">blunt junction:</text>
<text x="1158.0" y="89.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2429" text-anchor="end" font-weight="normal">stop codon, then backbone</text>
<text x="1180.0" y="300.0" font-family="Helvetica,Arial,sans-serif" font-size="14.5" fill="#1f2429" text-anchor="middle" font-weight="bold">4. Ligate → transform</text>
<text x="1180.0" y="322.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#5d666e" text-anchor="middle" font-weight="normal">DpnI, in the same tube, destroys</text>
<text x="1180.0" y="338.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#5d666e" text-anchor="middle" font-weight="normal">the methylated parent plasmid.</text>
<text x="650.0" y="430.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#5d666e" text-anchor="middle" font-weight="normal">A deletion of any length costs the same as a point mutation: the primers simply move further apart.</text>
</svg>