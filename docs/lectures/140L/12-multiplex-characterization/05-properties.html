<!-- ---------------------------------------------------------------- 34 -->
<article class="slide" data-bg="section">
  <div class="big"><p>Multiplex characterization of biological properties</p></div>
  <template class="notes">Multiplex characterization experiments are not limited to analyzing the biochemical functions of genes.  They also can be used to ask more systems-level questions about growth behavior or expression properties.</template>
  <template class="desc">Multiplex characterization of biological properties.</template>
</article>

<!-- ---------------------------------------------------------------- 35 -->
<article class="slide">
  <h1>TRMR/Genome Barcoding</h1>
  <ul class="tight">
    <li>PMID: 20639866</li>
  </ul>
  <figure class="fig"><img src="img/35-trmr.png" alt="Figure from the slide TRMR/Genome Barcoding."></figure>
  <template class="notes">TRMR is a method developed by Ryan Gill that involves the generation of genomic mutations from oligonucleotides.  These oligos are generated from chips and designed to target specific sites in specific genes with mutations and a barcode.  The procedure to introduce these mutations involve MAGE-like reactions involving homologous recombination enhanced by lambda red.  The result is a library of strains in which up and down mutations to the genes are tagged with barcodes.  Typically there is one such modification to each genome.  This population of bacteria is subjected to selections such as a challenge with a toxic metabolite.  Those mutations that enhance performance under these conditions become enriched while those that reduce performance are diminished.  After selection, the barcodes are PCR’d out of the sample and subjected to deep sequencing.  Based on the observed frequency of each barcode, the relevance of each mutation to a growth challenge can be inferred.</template>
  <template class="desc">TRMR/Genome Barcoding.</template>
</article>

<!-- ---------------------------------------------------------------- 36 -->
<article class="slide">
  <h1>CRE-Seq</h1>
  <ul class="tight">
    <li>PMID: 23129659</li>
  </ul>
  <figure class="fig"><img src="img/36-creseq.png" alt="Figure from the slide CRE-Seq."></figure>
  <template class="notes">CRE here means “Cis-regulatory elements”, not to be confused with Cre recombinase, which is unrelated.
Another use of multiplex characterization is for promoters.  In this variation, a library of promoter elements is placed upstream of an RFP gene and a barcode.  The barcode is unique to each promoter variant and will be incorporated into the mRNA if the gene is expressed.  The library of DNAs is introduced into retinal cells by electroporation, and then the mRNA was extracted.  If the promoter expressed during the experiment, then mRNAs will be present containing its barcode within this mixed mRNA sample.  After reverse transcription and PCR, the pool is sequenced, and the frequency of each barcode is calculated.  By normalizing against the frequency of each barcode in a deep sequence sample generated from the DNA present in the original sample, the relative expression of each gene can be quantified.  In this manner, the effect of different mutations of a promoter can be mapped out in one experiment.</template>
  <template class="desc">CRE-Seq.</template>
</article>
