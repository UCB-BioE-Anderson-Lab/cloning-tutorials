<article class="slide">
  <h1>CRE-Seq</h1>
  <ul class="tight">
    <li>PMID: 23129659</li>
  </ul>
  <figure class="fig"><img src="img/36-creseq.png" alt="Figure from the slide CRE-Seq."></figure>
  <template class="notes">CRE here means “Cis-regulatory elements”, not to be confused with Cre recombinase, which is unrelated.
Another use of multiplex characterization is for promoters.  In this variation, a library of promoter elements is placed upstream of an RFP gene and a barcode.  The barcode is unique to each promoter variant and will be incorporated into the mRNA if the gene is expressed.  The library of DNAs is introduced into retinal cells by electroporation, and then the mRNA was extracted.  If the promoter expressed during the experiment, then mRNAs will be present containing its barcode within this mixed mRNA sample.  After reverse transcription and PCR, the pool is sequenced, and the frequency of each barcode is calculated.  By normalizing against the frequency of each barcode in a deep sequence sample generated from the DNA present in the original sample, the relative expression of each gene can be quantified.  In this manner, the effect of different mutations of a promoter can be mapped out in one experiment.</template>
  <template class="desc">CRE-Seq.</template>
</article>
