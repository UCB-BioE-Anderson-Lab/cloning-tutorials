  <h1>Plib</h1>
  <ul>
    <li>To get through Plib, you probably need to order oligos this week</li>
  </ul>
  <template class="notes"></template>
  <template class="notes-add">Plib is the promoter library you are building in the TPcon6 cassette, and the degenerate oligos are the one part of it you cannot make yourself. Finalize the design, get the order in, and then the synthesis and the shipping happen whether you are in lab or not. If you wait until you have finished everything else, you will be sitting in lab with a cut vector and nothing to put in it. So this week: settle which positions you are saturating, check the degeneracy arithmetic against how many colonies you can realistically screen, and order. Bring the design to lab if you want a second pair of eyes on it before it goes.</template>
  <template class="desc">Plib: to get through it you probably need to order oligos this week.</template>

<article class="slide">
  <h1>Questions?</h1>
  <template class="notes"></template>
  <template class="notes-add">The one thing to carry out of today is that sequencing is a measurement instrument and not just a way to check a clone. If you can get the thing you care about tied to a sequence you can read &#8212; a barcode, a guide, an aptamer, the variant itself &#8212; then you can measure every member of a library at once instead of picking colonies and measuring them one at a time. That is worth keeping in mind for your own projects, because it is often the difference between an experiment you can finish this semester and one you cannot. Questions.</template>
  <template class="desc">A closing slide asking for questions.</template>
</article>
