<article class="slide" data-bg="section">
  <h1>Multiplex characterization of biological properties</h1>
  <template class="notes">Multiplex characterization experiments are not limited to analyzing the biochemical functions of genes.  They also can be used to ask more systems-level questions about growth behavior or expression properties.</template>
  <template class="notes-add">Everything up to here has asked what one molecule does &#8212; does this aptamer bind, does this RNA fold, does this zinc finger find its site. Now we move up a level and ask what the whole cell does, which means the measurement is growth. The example we will spend the rest of this section on is a single experiment that asks, for essentially every essential gene in two bacteria, how far down you can turn that gene before the cell suffers for it.</template>
  <template class="desc">Section divider on the amber ground: multiplex characterization of biological properties.</template>
</article>
