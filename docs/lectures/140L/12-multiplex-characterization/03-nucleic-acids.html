<article class="slide" data-bg="section">
  <h1>Multiplex characterization of functional nucleic acids</h1>
  <template class="notes">Since RNA and DNA libraries can be readily amplified by rtPCR or PCR directly, such libraries are prime candidates for analysis by deep sequencing.  Let’s look at some examples.</template>
  <template class="notes-add">Deep sequencing asks two quite different questions of RNA. One is how much of it there is, which is RNA-seq and is the commonest sequencing experiment anybody runs. The other is what the molecule does — an aptamer that binds a protein, a structured region of an mRNA whose shape is the whole point. Both are nucleic acids being characterized by counting reads, but the thing being counted is different, and it is worth keeping track of which question each experiment is answering.</template>
  <template class="desc">Section divider on the amber ground: Multiplex characterization of functional nucleic acids.</template>
</article>

<!-- ---------------------------------------------------------------- 25 -->
<article class="slide">
  <h1>SELEX with Deep Sequencing</h1>
  <div class="selex">
    <figure class="panel">
      <figcaption>Microfluidic-based SELEX of DNA Aptamer library</figcaption>
      <svg class="lead" viewBox="0 0 90 70" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><line x1="6" y1="6" x2="70" y2="52" stroke="#767676" stroke-width="2.5"/><path d="M 82 61 L 65 58 L 72 46 Z" fill="#767676"/></svg>
      <img src="img/25-selex-curve.png" alt="A binding curve: fluorescence intensity against single-stranded DNA concentration, for the initial library pool and the pools after rounds one, two and three. The first three lie almost flat together; the round-three pool rises steeply and saturates far above them.">
    </figure>
    <figure class="panel">
      <figcaption>Deep Sequencing</figcaption>
      <svg class="lead" viewBox="0 0 90 70" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><line x1="6" y1="6" x2="70" y2="52" stroke="#767676" stroke-width="2.5"/><path d="M 82 61 L 65 58 L 72 46 Z" fill="#767676"/></svg>
      <img src="img/25-selex-enrich.png" alt="Sequence counts against round-three over round-one enrichment fold. The great majority of sequences sit at low enrichment near the axis; a thin tail of individually rare sequences runs out to several thousand-fold.">
    </figure>
  </div>
  <p class="src">PMID: 20705898</p>
  <template class="notes">Here is an example from Tom Soh in which deep sequencing is used as the readout after a SELEX experiment.  They begin with a typical poly-N oligonucleotide containing PCR priming sites on both ends, then subject this library to selection for binding to a protein.  In this variant, they employ a microfluidic device to perform the separation of bound and unbound DNAs, however, this step of the experiment might also be done by more traditional columns or panning.  The sample is then prepped for deep sequencing, and they calculate the frequency of observed sequences within the hit population.  From this, they can identify the most promising sequences for further analysis.</template>
  <template class="notes-add">The paper is Cho and Xiao in Tom Soh&#8217;s lab at Santa Barbara, with Ron Stewart and Jamie Thomson in Wisconsin on the sequencing, PNAS 2010. They call it QSAS, quantitative selection of aptamers through sequencing, the separation is done on a micromagnetic separation device, and the target is PDGF-BB. What is worth taking seriously is what they do with the reads. They do not simply look at what is abundant at the end. They sequence after every round and follow more than ten million individual sequences through all of them, so each sequence carries a copy number and, more usefully, an enrichment-fold from one round to the next. That distinction is the whole method, because abundance on its own is a trap: a sequence can be common at the end because it binds the target, or because it amplifies well, or because it stuck to something it should not have, and a frequency cannot tell those apart. An enrichment measured across rounds can, because an amplification artifact does not keep getting better at binding, and they make exactly that argument &#8212; the method discriminates sequences that arise from experimental bias from ones that are really high-affinity binders. It also means the pool never has to converge. A conventional selection runs until a handful of sequences dominate, because that is what makes it affordable to clone and sequence a few dozen of them; here you can stop while the pool is still diverse and read the winners out of the data. They got aptamers to PDGF-BB with a Kd under 3 nM in three rounds, and against what conventional cloning pulled out they were three- to eight-fold better in affinity and two- to four-fold better in specificity.</template>
  <template class="desc">Two plots side by side, each with its caption above it and a short arrow leading down into it. Left, captioned microfluidic-based SELEX of DNA aptamer library: fluorescence intensity against single-stranded DNA concentration, with the starting pool and the round one and round two pools lying almost flat together and the round three pool rising steeply and saturating well above them. Right, captioned deep sequencing: sequence counts against round-three over round-one enrichment fold, with most sequences bunched at low enrichment near the axis and a thin tail running out to several thousand-fold.</template>
</article>


<!-- ---------------------------------------------------------------- 26 -->
<article class="slide">
  <h1>RNA Seq</h1>
  <div class="fg" data-fig="26"></div>
  <template class="notes">In a more analytical usage, RNA seq has become the most popular way of analyzing gene expression in cells and has largely replaced microarrays for this application.  Here, a mRNA is extracted from the sample and then converted to cDNA using reverse transcription.  In the process, the adapter sequences for deep sequencing are incorporated, and then read.  By counting the number of reads of each sequence, one gets a measure of the relative expression level of these genes in the original sample.  By comparing the frequency of a given gene across different samples, one can determine whether that gene is upregulated or downregulated under some conditions.</template>
  <template class="desc">A workflow drawn left to right, schematic. At the left, under the heading mRNA, three transcript species stacked in their own lanes: four long copies, eleven of a shorter one, two shorter still, each with a poly(A) tail. Two curved routes lead right, one labeled fragmentation then RT and the other RT then fragmentation, and both arrive at the sequence library, where each lane's fragments sit between adapters, four, six and two of them. An arrow runs to a box labeled Sequencer, and from it down to a field of short sequence reads in the same three lanes, sixteen, twenty-eight and four.</template>
</article>

<!-- ---------------------------------------------------------------- 27 -->
<article class="slide">
  <h1>PARS:  Cleavage with RNAses</h1>
  <figure class="fig"><img src="img/27-pars.png" alt="The PARS workflow in three parts. A capped, polyadenylated mRNA is folded in vitro and split down two arms. In arm a it is digested with RNase V1, which cuts double-stranded regions; in arm b with S1 nuclease, which cuts single-stranded ones. Each arm is then randomly fragmented, prepared as a sequencing library and deep sequenced, giving a profile of read counts along the sequence. In part c the two profiles are combined as the log base two of V1 over S1, the PARS score, plotted as a bar for each base above and below zero."></figure>
  <p class="src">PMID: 20811459</p>
  <template class="notes">Deep sequencing also allows us to ask more chemical questions about a biomolecule.  Here, the PARS method allows you to map out the secondary structure of an RNA in a multiplex fashion.  Samples of mRNA with a 5’ barcode are treated with enzymes that cleave various secondary structures.  These fragments are then subjected to deep sequencing revealing the fragments in between these secondary structural elements.  Effectively, it’s a lot like fingerprinting assays, but done more easily and on more sequences in parallel.</template>
  <template class="notes-add">Kertesz and Wan, with Howard Chang at Stanford and Eran Segal at the Weizmann, Nature 2010. The thing worth being clear about is why there are two enzymes, because they do opposite jobs and they are run as two separate reactions rather than as a mixture. They pull the poly-A transcripts out of log-phase yeast and refold them in a tube. One aliquot gets RNase V1, which cuts the backbone just 3&#8242; of a nucleotide that is base-paired. The other gets S1 nuclease, which cuts just 3&#8242; of a nucleotide that is unpaired. So a cut site is not a structural element; it is evidence about one nucleotide. A read beginning at a given base in the V1 library says that base was paired when the enzyme reached it, and a read beginning at the same base in the S1 library says it was unpaired. That is why you need both. Either enzyme on its own gives you cleavage counts confounded by how abundant the transcript is and how accessible that stretch happens to be. Take the log of the ratio of V1 reads to S1 reads at each nucleotide and those confounders divide out; what is left is a number per base, which they call the PARS score, high for paired and low for unpaired. The digestion is run so that each molecule is cut about once, which is what keeps the counts interpretable, and the library prep selects for enzyme-cut ends over the products of random degradation. They did this for more than three thousand yeast transcripts at single-nucleotide resolution, four V1 experiments and three S1, and read the biology off the result: more structure over coding regions than over untranslated ones, a three-base periodicity along the coding sequence, and an inverse relationship between how structured the region around the start codon is and how well the message is translated. The sequencing was SOLiD rather than Illumina, which makes no difference to the logic.</template>
  <template class="desc">A published figure in three parts. A capped, polyadenylated mRNA is folded and split down two arms: in one it is digested with RNase V1, which cuts double-stranded regions, in the other with S1 nuclease, which cuts single-stranded ones. Each arm is then randomly fragmented, made into a sequencing library and deep sequenced, giving a profile of read counts along the sequence. In the third part the two profiles are combined as the log base two of V1 over S1 and drawn as a bar for each base, above or below zero.</template>
</article>

<!-- ---------------------------------------------------------------- 28 -->
<article class="slide">
  <h1>SHAPE-Seq</h1>
  <figure class="fig"><img src="img/28-shape.png" alt="A reaction scheme. A constrained RNA with a free two-prime hydroxyl is in equilibrium with a flexible form; only the flexible form reacts appreciably with the reagent 1M7, whose structure is drawn above the arrow. The reaction releases carbon dioxide and leaves a two-prime O adduct on the ribose, drawn at the right."></figure>
  <p class="src">PMID: 21642531, 17367143, 20554050, 17406453</p>
  <template class="notes">The SHAPE reaction (Weeks) allows you to chemically distinguish residues on an mRNA that are flexible or constrained.  The 2’OH of an RNA base is more reactive when it is flexible, so it is more likely to react with this reagent 1M7.  Once incorporated, the 2’-adduct blocks reverse transcription resulting in fragment sequences.  The method provides a series of structural constraints that when combined with modeling methods provides insights in the tertiary structure and molecular dynamics of the molecule.</template>
  <template class="desc">A reaction scheme. At the left, a constrained RNA with a free two-prime hydroxyl sits in equilibrium with a flexible form of the same RNA. The reagent 1M7 is drawn above the reaction arrow; only the flexible form reacts with it appreciably. The reaction releases carbon dioxide and leaves a two-prime O adduct on the ribose, drawn at the right.</template>
</article>

<!-- ---------------------------------------------------------------- 29 -->
<article class="slide">
  <h1>SHAPE-Seq</h1>
  <figure class="fig"><img src="img/29-shapeseq.png" alt="The SHAPE-Seq protocol in two halves. In A, input RNAs are treated either with 1M7 or with a DMSO control; reverse transcription from a plus or minus handle primer stops wherever an adduct sits; the RNA is hydrolyzed, single-stranded DNA is ligated on, and the products are read as paired-end reads on an Illumina Genome Analyzer, with two adapter types marked. In B, reads are binned by handle, aligned and separated by barcode for each RNA; the plus and minus handle counts are plotted back to back along the sequence, passed through automated maximum likelihood estimation to give a reactivity for each base, and the reactivities constrain a predicted secondary structure."></figure>
  <template class="notes">SHAPE-Seq is a method developed in the Arkin lab by Julius Lucks that enables the readout of the SHAPE reaction by deep sequencing using a barcoding strategy.  This allows them to analyze the structural properties of libraries RNAs.</template>
  <template class="desc">A published protocol figure in two panels. In panel A, input RNAs are treated either with 1M7 or with a DMSO control; reverse transcription from a plus or minus handle primer stops wherever an adduct sits; the RNA is hydrolyzed, single-stranded DNA is ligated on, and the products are read as paired-end Illumina reads, with two adapter types marked. In panel B, the reads are binned by handle, aligned and separated by barcode for each RNA, the plus and minus counts are plotted back to back along the sequence, passed through maximum likelihood estimation to give a reactivity for each base, and those reactivities constrain a drawn secondary structure.</template>
</article>
