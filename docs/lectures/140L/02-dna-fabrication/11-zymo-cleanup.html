/* Page-local only.  deck.css is shared and is not touched from here.

   Six slides.  Two of them are drawings and live in seq/11-zymo.js; the
   other four are a divider, two product photographs and a screenshot,
   and need almost nothing beyond what deck.css already gives them.

   THE WHITE-LINE-ART CHECK, run on each raster before it was kept.  A
   figure drawn for the source deck's grey ground disappears on white.
   None of the three here is at risk: 79 and 80 are photographs shot on a
   light ground, 83 is a screenshot of a white page with dark text.  The
   one figure that WAS drawn in a hue set this deck does not own is the
   silica diagram on 81, in olive on a grey disc, and that one is not
   kept -- it is redrawn in the palette. */

/* The two figure slides reserve their drawing area with a spacer, the
   same contract 06 uses: the sequence appends an absolutely positioned
   SVG, and this holds the flow content out of its way.  Nothing else is
   in the flow on either slide, so the spacer is the whole body. */
.slide .figbox{flex:1 1 auto;min-height:0}

/* Slide 83's closing line is the source's, set under the screenshot at
   reading size rather than bullet size: it is an aside about two variant
   protocols, not a fourth thing to do. */
.slide p.aside{font-size:28px;margin:22px 0 0;max-width:1180px}
</style>
</head>

  </figure>
  <template class="desc">A photograph of the Zymo Research DNA Clean and Concentrator-5 kit: the yellow box, the wash and binding buffer bottles, the elution buffer vial, and a row of the small clear spin columns the DNA actually goes through.</template>

<!-- ---------------------------------------------------------------- 81 -->
<!-- The chemistry.  Redrawn rather than kept: the source's magnified
     disc is line art in olive and pale blue, and the guanidinium
     structure is a small molecule, which is the case the deck rebuilds
     natively every time.  seq/11-zymo.js draws it in three beats that
     follow the sentences of the source note.

     The source draws the column TWICE -- once on the left with the load
     and the product written round it, once on the right as the thing the
     magnifier is pointed at.  They are the same column, so here there is
     one, and the cone comes off its silica pad, which is what the disc
     is a magnification of. -->
<article class="slide" data-seq="zymo-chem">

  <div class="figbox" aria-hidden="true"></div>
</article>

<!-- ---------------------------------------------------------------- 82 -->
<!-- The column run.  The source shows three states side by side and
     leaves the room to reverse-engineer the order; the note walks four,
     in order, so it is built one per click.  The fourth is the drying
     spin, which the source figure does not draw and the note does. -->
<article class="slide" data-seq="zymo-column">
  <h1 class="small">DNA Purification Columns</h1>
  <div class="figbox" aria-hidden="true"></div>
  <div class="src">Adapted from takarabio.com</div>

<!-- ---------------------------------------------------------------- 83 -->
<!-- The cheatsheet.  Kept as a raster on purpose: this slide is not
     asking anyone to read nine steps off a projector, it is saying that
     the sheet exists and is on the bench.  Retyping it would turn a
     pointer into a protocol, which is a different claim and a second
     copy of a number that has to stay in step with the lab's. -->
<article class="slide">
  <h1>Zymo Cleanup</h1>
  <figure class="fig">
    <img src="img/11-zymo-cheatsheet.png"
         alt="The Regular Zymo Cleanup cheatsheet. It removes the polymerase, dNTPs, buffer and most of the oligonucleotides from a PCR reaction, and the buffer and restriction enzymes from a digest. Nine steps: add 180 microlitres of Zymo ADB buffer to the reaction; transfer into the Zymo column; spin at full speed 15 seconds and discard the waste; add 200 microlitres of PE Buffer; spin 15 seconds, discard; add 200 microlitres of PE Buffer again; spin 15 seconds, discard; spin 90 seconds to dry the sample, discard; elute with Elution Buffer into a fresh 1.5 millilitre Eppendorf tube, adding the volume on your protocol sheet down the middle of the column without letting it stick to the sides, then spin 45 seconds.">
  </figure>
  <p class="aside">There are also variant protocols for small fragments (&lt;200 bp long) and for DNA embedded in agarose gel</p>
  <template class="notes">These cheatsheats with the protocol are in the lab</template>
  <template class="desc">A screenshot of the Regular Zymo Cleanup cheatsheet, the one that is printed and kept at the bench: a short paragraph on what the procedure removes, then the nine numbered steps, from adding 180 microlitres of ADB buffer through two PE buffer washes and a 90 second drying spin to the elution. Below it, a line noting that there are also variant protocols for fragments under 200 base pairs and for DNA embedded in agarose gel.</template>
</article>
