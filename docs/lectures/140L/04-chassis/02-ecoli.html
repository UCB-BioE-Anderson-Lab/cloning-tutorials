  <h1 class="small"><i>E. coli</i></h1>

<!-- ---------------------------------------------------------------- 14 -->
<article class="slide" data-seq="lineage">
  <h1 class="small">Where the strains came from</h1>
  <template class="notes">The laboratory strains in common use are almost all descendants of a single isolate, and the two lineages that are not are the two you are most likely to meet by accident. This is drawn rather than listed because it is a pedigree, and because which root a strain sits under is the thing that decides what you inherit from it. If you want the whole story, the two-volume Neidhardt and Curtiss set is the reference, and Birge is the one to read for the molecular genetics.</template>
  <template class="desc">A pedigree of the laboratory E. coli strains, grown one branch at a time from three founding isolates: K-12, B and W.</template>
</article>

<!-- ------------------------------------------------------------- 15, 16 -->
<article class="slide" data-seq="neighbours">
  <h1 class="small">The neighbours</h1>
  <template class="notes">Two source slides fold together here. The first was the tree of life again with a sentence saying E. coli is a gamma-proteobacterium, which is one rank of the five drawn on this figure; the second was the rank list beside the genus list. They are one picture, so they are drawn as one.</template>
  <template class="desc">E. coli's position in taxonomy, drawn as nested boxes from Bacteria down to the Enterobacteriaceae, then the genera inside that family.</template>
</article>

<!-- ---------------------------------------------------------------- 17 -->
<article class="slide" data-seq="pathotypes">
  <h1 class="small"><i>E. coli</i> strains</h1>
  <template class="notes">Pathogenicity is not a property of a species, except where the species is defined by the illness it causes. Prokaryotic species including E. coli are defined by ribosomal RNA sequence, by overall genome similarity, and by a few assayable properties; one of the properties that defines E. coli is that it carries the lactose catabolic genes. Beyond that, strains get sorted by what kind of harm they do, and most of the characterised ones do some, because those are the ones people study.</template>
  <template class="desc">The six categories of E. coli, drawn on a cutaway of the gut wall: a commensal in the lumen, then the five pathotypes, each doing its own damage in its own way.</template>
</article>
