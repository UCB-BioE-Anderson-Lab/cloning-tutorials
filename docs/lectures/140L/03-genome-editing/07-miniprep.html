<article class="slide" data-bg="section">
  <h1>Miniprepping</h1>
  <template class="notes">Now getting the plasmid back out of the cells you grew. Two halves: break the cells open in a way that leaves the plasmid intact, then pull it out of everything else.</template>
  <template class="desc">Section divider: Miniprepping.</template>
</article>

<article class="slide">
  <h1 class="small">Miniprep kit</h1>
  <p class="see">Step by step: <a href="../../../wetlab/miniprep/">Miniprep tutorial</a> &nbsp;&middot;&nbsp;
     <a href="../../../cheatsheets/miniprep.pdf">bench cheatsheet</a></p>
  <figure class="fig">
    <img src="img/07-miniprep-kit.png" alt="A Qiagen miniprep kit box with its bottles of buffers and a bag of spin columns beside it.">
  </figure>
  <template class="notes">The kit is buffers and columns, and the buffers have names that tell you nothing. So here is what is in them and why, because two of these steps are the whole method and the rest is washing.</template>
  <template class="desc">A photograph of a Qiagen miniprep kit: the box, the buffer bottles and the spin columns.</template>
</article>

<!-- The reason, before the pipetting.  The list that follows is six
     volumes and three buffer names; the one idea the whole procedure
     turns on is that a small circle re-pairs and a chromosome cannot,
     and it was only ever in the speaker note.  seq/07-lysis.js. -->
<article class="slide" data-seq="lysis">
  <h1 class="small">Why this works at all</h1>
  <template class="notes">Before the volumes, the reason. The chromosome and the plasmid are both double-stranded and both covalently closed circles, and the method turns on what happens to each of them when you denature it. The plasmid is small enough that its two strands stay wound round each other with nowhere to go. The chromosome is fifteen hundred times longer, its strands drift apart, and on neutralising they cannot find each other again. Length is what makes that true, but the thing being exploited is the topology.</template>
  <template class="desc">A cell drawn as a rounded box, with one long wandering line for the chromosome and six small circles for the plasmid.</template>
</article>

<!-- The six-step list is not a slide any more.  JCA: "ditch this slide as
     a standalone... instead, have that repeated on each of the animation
     slides of the procedure highlighting in red which step you are on."
     So it runs down the left of every beat with the current line in red,
     and the blue -- the plasmid -- is somewhere you can point at on all
     of them.  seq/07-bench.js. -->
<article class="slide" data-seq="lysisrun">
  <h1 class="small">Alkaline lysis</h1>
  <template class="notes">The recipe is on the slide the whole way through, with the step you are on picked out. Watch the blue: it starts inside the cells and ends up in the supernatant, and every step is just moving it.</template>
  <template class="desc">The alkaline lysis half of a miniprep, run in a tube beside the six-step protocol, with the current step picked out in red and the plasmid drawn in blue at every stage.</template>
</article>

<!-- Nine bullets replaced by the column being run.  Every line of that
     list read "spin 15 s, discard" and nothing on the slide said what
     had left the column that time.  JCA: "showing the column and what is
     happening to it, like exchange of tubes below it, liquids in it with
     their labels being squirted in."  seq/07-column.js. -->
<article class="slide" data-seq="column">
  <h1 class="small">Column cleanup</h1>
  <template class="notes">The second half is a silica column and three washes. The DNA binds in chaotropic salt, the protein comes off in one wash, the salt comes off in the next, and the dry spin gets rid of the ethanol that would otherwise ruin your sequencing read.</template>
  <template class="desc">The column half of a miniprep, run rather than listed: the lysate loaded, the DNA bound to the frit, three washes squirted in and spun through, a dry spin, the waste tube exchanged for a clean one, and the plasmid eluted into it.</template>
</article>
