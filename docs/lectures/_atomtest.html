<!-- scratch harness: renders one duplex statically so a mid-cycle frame can be
     looked at. Not linked from anywhere; delete before deploying. -->
<link rel="stylesheet" href="deck.css">
<div style="position:relative;width:1600px;height:900px;background:#fff">
  <svg id="s" viewBox="0 0 1600 900" style="position:absolute;inset:0"></svg>
</div>
<script src="140L/01-dna-enzymes/seq/atoms.js"></script>
<script src="140L/01-dna-enzymes/seq/dna-model.js"></script>
<script>
  const M=window.DNAModel;
  const m=M.make({top:"GAATTC", endHot:1, ends:{t5:"biotin", b5:"biotin"}});
  document.getElementById("s").innerHTML=M.draw(m);
</script>
