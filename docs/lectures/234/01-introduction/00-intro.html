<article class="slide" data-bg="lecture">
  <h1>Biodesign Automation</h1>
  <p><small>BioE 134/234 &middot; UC Berkeley</small></p>
  <template class="notes">Every other engineering discipline designs in software before it builds anything. Biology mostly does not. That gap is what this course is about, and it is a better time to be closing it than it has ever been, because a language model can now carry the part that was always the bottleneck — the interface — provided that real code carries the part that has to be correct. The whole term builds toward one thing: a suite of tools a model can call to do real design work, and enough judgment to know when it has called them wrong.</template>
  <template class="desc">Lecture title slide: Biodesign Automation, BioE 134/234, UC Berkeley.</template>
</article>

<article class="slide" data-bg="section">
  <h1>Why automate?</h1>
  <template class="notes">Start with the question the rest of the lecture answers. Not "can we", but why it is worth the trouble at all, given that biology has got a very long way on graduate students and pipettes.</template>
  <template class="desc">Section divider: Why automate?</template>
</article>

<article class="slide">
  <h1 class="small">Software is eating the world</h1>
  <figure class="fig"><img src="img/software-eating-world.jpg" alt="Marc Andreessen"><figcaption>Marc Andreessen, 2011</figcaption></figure>
  <template class="notes">Venture capitalist Marc Andreessen said "Software is eating the world" back in 2011. He was referring to the fact that every aspect of our daily lives and businesses is becoming highly software-integrated. Biology is one of the few domains where this is not yet the case.</template>
  <template class="desc">A photograph of Marc Andreessen, who wrote in 2011 that software is eating the world.</template>
</article>
